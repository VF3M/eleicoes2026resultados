<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração 2026 · 1º turno · ao vivo</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Apuração 26">
<meta name="description" content="Apuração ao vivo 2026 (TSE): Presidente, mapa, probabilidade, SC, deputados e Imbituba">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Crect x='14' y='30' width='36' height='22' rx='3' fill='%23fff'/%3E%3Crect x='24' y='10' width='16' height='22' rx='2' fill='%23d32f2f' transform='rotate(12 32 21)'/%3E%3Crect x='22' y='34' width='20' height='4' rx='2' fill='%231565c0'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Crect x='14' y='30' width='36' height='22' rx='3' fill='%23fff'/%3E%3Crect x='24' y='10' width='16' height='22' rx='2' fill='%23d32f2f' transform='rotate(12 32 21)'/%3E%3Crect x='22' y='34' width='20' height='4' rx='2' fill='%231565c0'/%3E%3C/svg%3E">
<style>
:root{--bg:#ffffff;--bg2:#f6f6f3;--card:#ffffff;--fg:#141414;--fg2:#3a3a3a;--mut:#6f6f6f;--bd:#e4e4e1;--line:#e4e4e1;--acc:#141414;--link:#0b57d0;--bar:#ececea;--ok:#2e7d32;--warn:#a15c00;--err:#c62828;--chip:#f1f1ee;--pt:#c62828;--pl:#1565c0;--oth:#a3a3a3;--prg:#3d3d3d;--live:#d32f2f;--sh:0 1px 0 rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#111213;--bg2:#18191b;--card:#111213;--fg:#ededed;--fg2:#cfcfcf;--mut:#9a9a9a;--bd:#2a2b2e;--line:#2a2b2e;--acc:#ededed;--link:#8ab4f8;--bar:#26272a;--ok:#66bb6a;--warn:#ffb74d;--err:#ef5350;--chip:#1d1e21;--pt:#ef5350;--pl:#42a5f5;--oth:#6f6f6f;--prg:#cfcfcf;--live:#ff5252}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;font:400 16px/1.5 Inter,"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-feature-settings:"cv11","ss01";background:var(--bg);color:var(--fg);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
b,strong{font-weight:650}
button{font:inherit;font-size:14px;font-weight:550;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer;flex:none;transition:background .15s,border-color .15s}
button:hover{border-color:var(--fg)}
/* header */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1080px;margin:0 auto}
.brand{flex:1 1 auto;min-width:0}
.brand h1{font-size:17px;font-weight:750;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.live{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--live);text-transform:uppercase}
.live i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
#status{color:var(--mut)}#status.err{color:var(--err)}
#refresh{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%}
#refresh svg{width:18px;height:18px}#refresh.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rbar{display:none;height:2px}.rbar>i{display:block;height:100%;width:0;background:var(--fg);opacity:.25;transition:width 1s linear}
.tabs{display:flex;gap:2px;padding:0 16px 10px;max-width:1080px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs{--segbg:var(--chip)}
.tabs button{flex:none;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:7px 14px;border:0;border-radius:8px;background:none;color:var(--mut);min-height:36px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--chip);color:var(--fg)}
.ti{display:grid;place-items:center}.ti svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:760px){
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:0;max-width:none}
  .tabs button{flex-direction:column;gap:3px;font-size:10.5px;font-weight:600;padding:6px 0;min-height:54px;border-radius:10px;letter-spacing:.01em}
  .tabs button.on{background:none;color:var(--fg)}
  .tabs button.on .ti{background:var(--chip);border-radius:999px}
  .ti{width:46px;height:28px}.ti svg{width:21px;height:21px}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .hb{padding:10px 16px}
  header .tabs{border-bottom:0}
}
/* layout */
main{max-width:1080px;margin:0 auto;padding:0 16px 8px}
.view{display:none}.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
section{scroll-margin-top:120px}
h2.grp{font-size:11.5px;font-weight:750;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:24px 0 0;padding:0 0 8px;border-bottom:2px solid var(--fg)}
.card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0 20px;margin:0}
.card h3{margin:0 0 4px;font-size:19px;font-weight:750;letter-spacing:-.015em;line-height:1.25}
.meta{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.meta b{color:var(--fg2)}
.prog{height:4px;background:var(--bar);border-radius:2px;overflow:hidden;margin:10px 0 6px}.prog>div{height:100%;background:var(--prg);transition:width .6s}
/* candidate rows */
.cands{margin-top:12px}
.cand{padding:12px 0;border-top:1px solid var(--line)}
.cand.has-av{display:grid;grid-template-columns:44px 1fr;column-gap:12px;align-items:center}
.cand.has-av .av{grid-row:1/3}
.cand.cut{border-bottom:1px dashed var(--fg)}
.cl{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0}
.pos{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;min-width:1.6em}
.nm{font-weight:650;font-size:15px;letter-spacing:-.005em;text-transform:capitalize}
.party{color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.02em}
.ptag{display:inline-block;font-size:10.5px;font-weight:750;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--chip);color:var(--fg2);line-height:1.3}
.ptag.c-pt{background:color-mix(in srgb,var(--pt) 12%,transparent);color:var(--pt)}.ptag.c-pl{background:color-mix(in srgb,var(--pl) 12%,transparent);color:var(--pl)}
.pnum{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.cv{display:flex;align-items:center;gap:12px;margin-top:4px}
.pc{font-size:20px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:4.3em;line-height:1.2}
.bar{position:relative;flex:1;height:6px;background:var(--bar);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--oth);border-radius:3px;transition:width .6s ease}.bar>i.c-pt{background:var(--pt)}.bar>i.c-pl{background:var(--pl)}
.bar>b{position:absolute;top:0;bottom:0;background:currentColor;opacity:.2;border-radius:3px}
.vt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.av{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--chip);color:var(--fg2);font-size:14px;font-weight:750;letter-spacing:.02em;flex:none}
.av.c-pt{background:color-mix(in srgb,var(--pt) 16%,var(--bg));color:var(--pt)}.av.c-pl{background:color-mix(in srgb,var(--pl) 16%,var(--bg));color:var(--pl)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.av.c-pt{box-shadow:inset 0 0 0 2px var(--pt)}.av.c-pl{box-shadow:inset 0 0 0 2px var(--pl)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;line-height:1.35;white-space:nowrap}
.t-el,.t-par{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.t-2t{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.t-x{border:1px solid var(--line);color:var(--mut)}
.note{margin-top:14px;font-size:14px;line-height:1.5;padding:10px 12px;border-left:3px solid var(--fg);background:var(--bg2);border-radius:0 6px 6px 0;color:var(--fg2)}
.errbox{color:var(--err);font-size:13.5px;white-space:pre-wrap}
details>summary{cursor:pointer;color:var(--fg);font-size:14px;font-weight:650;margin-top:0;padding:12px 0;list-style:none;text-align:center;border-top:1px solid var(--line)}
details>summary::-webkit-details-marker{display:none}
details[open]>summary .more{display:none}details:not([open])>summary .less{display:none}
/* grids */
.grid{display:grid;grid-template-columns:1fr;gap:0 24px;margin:0}
.grid .card{padding:14px 0 16px}
.uc h3,.rc h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px}
.uc .cand,.rc .cand{padding:8px 0}.uc .pc,.rc .pc{font-size:16px;min-width:3.9em}.uc .nm,.rc .nm{font-size:14px}
#v-imb .cand,#v-imb .fr{cursor:pointer}#v-imb [data-cargo="1"] .cand{cursor:default;background:none!important}#v-imb .cand:hover,#v-imb .fr:hover{background:var(--bg2)}
.uc .prog,.rc .prog{height:3px;margin:6px 0 2px}
.rgh{grid-column:1/-1;font-size:11.5px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;margin:20px 0 0;padding-bottom:6px;border-bottom:1px solid var(--fg)}
@media (min-width:640px){.grid.u,.grid.r{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.grid.u,.grid.r{grid-template-columns:repeat(3,1fr)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}}
@media (min-width:1060px){.grid.u{grid-template-columns:repeat(4,1fr)}}
.cols>*,.grid>*{min-width:0}
/* hero */
.hero{padding:20px 0 20px;border-bottom:1px solid var(--line)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kicker{font-size:11.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}
.pill.win{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.h2h{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.side{display:flex;align-items:center;gap:12px;min-width:0}.side.r{flex-direction:row-reverse;text-align:right}
.side .av{width:64px;height:64px;font-size:20px}
.hn{font-size:14px;font-weight:700;letter-spacing:-.005em;line-height:1.2}
.hp{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;margin:2px 0}
.hv{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.stack{position:relative;display:flex;height:22px;border-radius:3px;overflow:visible;background:var(--bar);margin:18px 0 6px}
.stack>i{display:block;height:100%;transition:width .6s ease}.stack>i:first-child{border-radius:3px 0 0 3px}.stack>i:nth-child(3){border-radius:0 3px 3px 0}
.stack .mid{position:absolute;top:-6px;bottom:-6px;left:50%;width:0;border-left:2px solid var(--fg)}
.stack-lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.stack-lbl .c{position:relative;text-align:center;flex:1}
.hero-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.hero-meta b{color:var(--fg)}
@media (max-width:420px){.hp{font-size:34px}.side .av{width:52px;height:52px;font-size:17px}.side{gap:10px}}
/* resumo grid */
.rgrid{display:grid;grid-template-columns:1fr;gap:0 32px}@media (min-width:760px){.rgrid{grid-template-columns:1fr 1fr}}
.tapcard{cursor:pointer}
.go{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:13.5px;font-weight:650;color:var(--link)}
.mini2 .cand{padding:10px 0}.mini2 .pc{font-size:18px}
/* chances */
.meter{margin-top:14px}.mtrack{position:relative;height:14px;background:var(--bar);border-radius:7px;overflow:hidden}.mtrack>i{display:block;height:100%;background:var(--oth)}
.mtrack>i.c-pt{background:var(--pt)}.mtrack>i.c-pl{background:var(--pl)}
.mlbl{display:flex;justify-content:space-between;gap:12px;margin-top:10px}
.mlbl .mv{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.mlbl .ml{font-size:12.5px;color:var(--mut);margin-top:4px}.mlbl>div:last-child{text-align:right}
.ci{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bar);flex:1}.split>i{display:block;height:100%}
.ufr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.ufr b{min-width:2.4em}
.ufr .n{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12.5px;white-space:nowrap;min-width:6.5em;text-align:right}
.c-pt-t{color:var(--pt)}.c-pl-t{color:var(--pl)}
/* map */
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;margin-top:12px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:13px;color:var(--mut);min-height:32px}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mapw{display:grid;grid-template-columns:1fr;gap:8px;align-items:start;margin-top:8px}
.map{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.map .uf{stroke:var(--bg);stroke-width:.6;stroke-linejoin:round;cursor:pointer;transition:opacity .15s}
.map .uf:hover{opacity:.85}.map .uf.sel{stroke:var(--fg);stroke-width:1.6}
.map .rg{fill:none;stroke:var(--bg);stroke-width:2.4;stroke-linejoin:round;pointer-events:none}
.map text{font-family:inherit;text-anchor:middle;paint-order:stroke;stroke:color-mix(in srgb,var(--bg) 85%,transparent);stroke-width:3px;fill:var(--fg);font-weight:750;pointer-events:none}
.map .t1{font-size:13px}.map .t2{font-size:11px;font-weight:600}.map .t3{font-size:9.5px;font-weight:500}
.map .ul{font-size:9px;font-weight:700;stroke-width:2.2px}
@media (max-width:560px){.map .t2,.map .t3{display:none}.map .t1{font-size:15px}}
.mscale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);margin:6px auto 0;max-width:420px}
.mscale .g{flex:1;height:8px;border-radius:4px}
.mleg{display:flex;flex-direction:column}.mrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.mrow .sw{width:12px;height:12px;border-radius:3px;flex:none;margin-top:5px}.mrow .mt{flex:1;min-width:0}
.mrow .nums{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:14px}.mrow .nums b{font-size:17px;font-weight:750}
@media (min-width:900px){.mapw{grid-template-columns:1.25fr 1fr;gap:32px}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s ease;max-height:70vh;overflow:auto}
.sheet{visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}.sheet.show{transform:none;visibility:visible;transition:transform .25s ease}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h3{display:flex;justify-content:space-between;align-items:center;margin:0;font-size:19px}
.sheet .x{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;line-height:1}
@media (min-width:761px){.sheet{left:auto;right:24px;bottom:24px;width:380px;border-radius:14px;border:1px solid var(--line)}}
/* seats */
.seatbox{margin-top:16px;padding-top:12px;border-top:2px solid var(--fg)}.seatbox h4{margin:16px 0 6px;font-size:11.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.seats{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}.seats>i{width:14px;height:14px;border-radius:50%;background:var(--oth)}
.seats>i.c-pt,.chip>i.c-pt{background:var(--pt)}.seats>i.c-pl,.chip>i.c-pl{background:var(--pl)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--chip);border-radius:6px;padding:4px 10px}
.chip>i{width:9px;height:9px;border-radius:50%;background:var(--oth)}
.sr{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}.sr .vt{margin-left:auto}
/* full list */
.full{margin-top:8px;min-width:0}.ftools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.ftools input{flex:1 1 160px;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.ftools input:focus{outline:2px solid var(--fg);outline-offset:-1px}
.ftools button{font-weight:650}
.pchips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.pchips::-webkit-scrollbar{display:none}
.pch{font-size:12px;padding:4px 10px;border-radius:6px;background:var(--chip);border:0;color:var(--fg2)}.pch.on{background:var(--fg);color:var(--bg)}
.fr{padding:9px 0;border-top:1px solid var(--line);font-size:14px}.fr .l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}.fr .l2{display:flex;align-items:center;gap:10px;margin-top:4px;padding-left:2.2em}
.fr.cut{border-bottom:1px dashed var(--fg)}.fr .nm{font-weight:650;font-size:14px}
.fr .fv{flex:1;height:4px;background:var(--bar);border-radius:2px;overflow:hidden;min-width:40px}.fr .fv>i{display:block;height:100%;background:var(--oth)}.fr .fv>i.c-pt{background:var(--pt)}.fr .fv>i.c-pl{background:var(--pl)}
/* per section */
.big-btn{width:100%;padding:12px;font-weight:650;font-size:15px;border-radius:8px;margin-top:10px}
.sh{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:15px;font-variant-numeric:tabular-nums}.sh .split{height:10px}

<script>
"use strict";
// ---- Configuração ----
const REFRESH_MS = 60000;
// Se a página for servida pelo servidor.py (proxy), usa /tse/; senão busca direto no TSE (CORS liberado).
// Servida por http(s) (servidor.py local ou túnel público) -> proxy /tse; aberta como arquivo -> direto no TSE.
// Detecta: se a origem tem o proxy /tse (servidor.py), usa-o; senão busca direto no TSE (CORS do TSE ecoa a origem).
const DIRECT = "https://resultados.tse.jus.br/oficial";
let BASE = DIRECT;
async function detectBase() {
  if (!location.protocol.startsWith("http")) return;
  try { const r = await fetch(location.origin + "/tse/comum/config/ele-c.json?_=" + Date.now(), {cache:"no-store"});
        if (r.ok && (r.headers.get("content-type")||"").includes("json")) BASE = location.origin + "/tse"; } catch (e) {}
}
const FALLBACK_ELE = {"Presidente":"6257","Governador":"6259","Senador":"6259","Deputado Federal":"6259","Deputado Estadual":"6259"};
const MUN = {cd:"81434", nome:"Imbituba", uf:"sc"};
const RACES = [ // id, título, cargo, uf, nome no config, topN estado, topN município, colapsar após
  {key:"pres", t:"Presidente (Brasil)", cargo:1, uf:"br", nm:"Presidente", top:4, mtop:5},
  {key:"gov",  t:"Governador SC",       cargo:3, uf:"sc", nm:"Governador", top:4, mtop:5},
  {key:"sen",  t:"Senado SC",           cargo:5, uf:"sc", nm:"Senador", top:6, mtop:5},
  {key:"df",   t:"Deputado Federal SC", cargo:6, uf:"sc", nm:"Deputado Federal", top:16, mtop:5},
  {key:"de",   t:"Deputado Estadual SC",cargo:7, uf:"sc", nm:"Deputado Estadual", top:40, mtop:5, collapse:true},
];

// ---- Utilitários (puros; testáveis) ----
const num = s => { if (s==null||s==="") return 0; s=String(s); return s.includes(",") ? parseFloat(s.replace(/\./g,"").replace(",",".")) : parseFloat(s); };
const fint = s => { const n=parseInt(s,10); return isNaN(n) ? (s??"—") : n.toLocaleString("pt-BR"); };
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad6 = e => String(parseInt(e,10)).padStart(6,"0");
function url(ele, uf, cargo, mu) {
  return `${BASE}/ele2026/${ele}/dados/${uf}/${uf}${mu||""}-c${String(cargo).padStart(4,"0")}-e${pad6(ele)}-u.json`;
}
function eleMap(cfg) { // ele-c.json -> {nome do cargo: código da eleição} (ele2026, 1º turno)
  const m = {};
  for (const pl of cfg.pl||[]) { if (pl.c!=="ele2026") continue;
    for (const e of pl.e||[]) { if (e.t!=="1") continue;
      for (const a of e.abr||[]) for (const cp of a.cp||[]) if (!(cp.ds in m)) m[cp.ds]=e.cd; } }
  return m;
}
function parseU(d) { // -u.json -> objeto normalizado
  const s=d.s||{}, v=d.v||{}, k=(d.carg||[])[0]||{};
  const cands=[];
  for (const a of k.agr||[]) for (const p of a.par||[]) for (const c of p.cand||[])
    cands.push({nome:c.nmu||c.nm, num:c.n, partido:p.sg, vap:parseInt(c.vap||"0",10), pvap:c.pvap, e:c.e, st:c.st||"", dvt:c.dvt||"", foto: c.sqcand ? `${DIRECT}/ele2026/${d.ele}/fotos/${d.ele==="6257"?"br":MUN.uf}/${c.sqcand}.jpeg` : ""});
  cands.sort((x,y)=>y.vap-x.vap);
  return {dt:d.dt||"", ht:d.ht||"", gen:`${d.dg||""} ${d.hg||""}`.trim(), tf:d.tf, pst:s.pst||"0,00", st:parseInt(s.st||"0",10), ts:parseInt(s.ts||"0",10),
          vv:parseInt(v.vv||"0",10), vb:v.vb, vn:v.tvn, vagas:parseInt(k.nv||"0",10), cands,
          te:parseInt((d.e||{}).te||"0",10), est:parseInt((d.e||{}).est||"0",10), comp:parseInt((d.e||{}).c||"0",10)};
}
function flagOf(c) {
  const st=(c.st||"").toLowerCase();
  if (c.e==="s" || st.startsWith("eleito")) return `<span class="tag t-el">${esc(c.st||"ELEITO")}</span>`;
  if (st.includes("2º turno")||st.includes("2o turno")||st.includes("segundo")) return `<span class="tag t-2t">${esc(c.st)}</span>`;
  if (st) return `<span class="tag t-x">${esc(c.st)}</span>`;
  return "";
}
function trendNote(r, race) { // apenas Presidente/Governador no total BR/UF
  if (![1,3].includes(race.cargo) || !r.cands.length || r.vv===0) return "";
  const el=r.cands.filter(c=>c.e==="s"), t2=r.cands.filter(c=>/2º turno/i.test(c.st));
  if (el.length) return `<div class="note"><b>Eleito (TSE):</b> ${el.map(c=>esc(c.nome)).join(", ")}</div>`;
  if (t2.length) return `<div class="note"><b>2º turno (TSE):</b> ${t2.map(c=>esc(c.nome)).join(" × ")}</div>`;
  const L=r.cands[0];
  return num(L.pvap) < 50
    ? `<div class="note">Tendência de <b>2º turno</b>: líder ${esc(L.nome)} tem ${esc(L.pvap)}% dos válidos (&lt; 50%) · parcial com ${esc(r.pst)}% das urnas.</div>`
    : `<div class="note">Líder ${esc(L.nome)} com ${esc(L.pvap)}% dos válidos (&gt; 50%) – venceria no 1º turno se mantido · parcial com ${esc(r.pst)}% das urnas.</div>`;
}
const ccls = c => c.partido==="PT" ? "c-pt" : c.partido==="PL" ? "c-pl" : "";
const initials = n => String(n||"").replace(/^(DR|DRA|PROFESSOR|PROFESSORA|PASTOR|DELEGADO|DELEGADA|SARGENTO|CAPITÃO|CORONEL|ESCRITOR|DEPUTADO|PADRE)\.? /i,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("");
const avatar = c => `<span class="av ${ccls(c)}">${esc(initials(c.nome))}${c.foto?`<img src="${esc(c.foto)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`;
const nmCase = s => esc(String(s||"").toLowerCase().replace(/(^|[\s\-])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/ (De|Da|Do|Dos|Das|E) /g,m=>m.toLowerCase()));
function candRow(c, i, maxp, cut, extra) {
  return `<div class="cand has-av${cut?" cut":""}" data-num="${esc(c.num||"")}">${avatar(c)}<div class="cl"><span class="nm">${nmCase(c.nome)}</span><span class="ptag ${ccls(c)}">${esc(c.partido)}</span>${c.num?`<span class="pnum">${esc(c.num)}</span>`:""}${flagOf(c)}${extra||""}</div>
    <div class="cv"><span class="pc">${esc(c.pvap)}%</span><div class="bar"><i class="${ccls(c)}" style="width:${Math.min(100,num(c.pvap)/maxp*100).toFixed(1)}%"></i></div><span class="vt">${fint(c.vap)} votos</span></div></div>`;
}
function renderRace(race, r, opts) {
  const top = opts.mun ? race.mtop : race.top;
  const pct = Math.min(100, num(r.pst));
  const tot = r.ht ? `Totalização ${esc(r.dt)} ${esc(r.ht)}` : "Ainda não totalizado";
  const vagas = (!opts.mun && [5,6,7].includes(race.cargo) && r.vagas) ? ` · <b>${r.vagas} vaga${r.vagas>1?"s":""}</b>` : "";
  let h = `<div class="card" data-cargo="${race.cargo}"><h3>${esc(opts.title)}</h3>
    <div class="meta">${tot}${r.tf==="s"?" · <b>finalizada</b>":""}</div>
    <div class="prog"><div style="width:${pct}%"></div></div>
    <div class="meta"><b>${esc(r.pst)}%</b>${finTag(r)} das urnas apuradas (${fint(r.st)} de ${fint(r.ts)} seções)${vagas}<br>válidos ${fint(r.vv)} · brancos ${fint(r.vb)} · nulos ${fint(r.vn)}</div>`;
  const isDep = [6,7].includes(race.cargo), fid = race.key + (opts.mun ? "-m" : "");
  if (r.st===0 || r.vv===0) return h + `<div class="meta" style="margin-top:8px"><i>Nenhuma seção apurada ainda.</i></div>` + (isDep ? fullTools(fid, r.cands, new Set(), 0) : "") + `</div>`;
  const maxp = num(r.cands[0]?.pvap)||1;
  let SA = null; if (!opts.mun && [6,7].includes(race.cargo) && opts.raw) { try { SA = seatAlloc(opts.raw); } catch (e) { console.warn(e); } }
  const elSet = new Set(SA ? SA.eleitos.map(c=>c.num) : []);
  const row = (c,i) => candRow(c, i, maxp, r.vagas>1 && i===r.vagas-1 && (isDep || (!opts.mun && race.cargo===5 && !SA)), elSet.has(c.num) ? '<span class="tag t-par">eleito</span>' : "");
  if (isDep) { const N = r.vagas || top;
    h += `<div class="cands">${r.cands.slice(0,N).map(row).join("")}</div>` + fullTools(fid, r.cands, elSet, N);
    if (SA) h += renderSeats(SA);
    return h + `</div>`; }
  const list = r.cands.slice(0, top);
  const first = race.cargo>=6 ? 6 : 10;
  if (!opts.mun && list.length > first + 2) {
    h += `<div class="cands">${list.slice(0,first).map(row).join("")}</div>
      <details><summary><span class="more">Mostrar mais (${first+1}º–${list.length}º) ▾</span><span class="less">Mostrar menos ▴</span></summary><div class="cands" style="margin-top:0">${list.slice(first).map((c,i)=>row(c,i+first)).join("")}</div></details>`;
  } else h += `<div class="cands">${list.map(row).join("")}</div>`;
  if (!opts.mun) h += trendNote(r, race);
  if (SA) h += renderSeats(SA);
  return h + `</div>`;
}
const REGIOES = [["Norte",["ac","am","ap","pa","ro","rr","to"]],["Nordeste",["al","ba","ce","ma","pb","pe","pi","rn","se"]],
  ["Centro-Oeste",["df","go","ms","mt"]],["Sudeste",["es","mg","rj","sp"]],["Sul",["pr","rs","sc"]]];
function aggregate(list) { // list de parseU() -> soma votos absolutos por candidato
  const by = {}; let vv=0, st=0, ts=0;
  for (const r of list) { vv+=r.vv; st+=r.st; ts+=r.ts;
    for (const c of r.cands) { const k=c.num; (by[k] ||= {nome:c.nome, partido:c.partido, num:c.num, vap:0}).vap += c.vap; } }
  const cands = Object.values(by).sort((a,b)=>b.vap-a.vap)
    .map(c => ({...c, pvap: vv ? (c.vap/vv*100).toFixed(2).replace(".",",") : "0,00"}));
  return {vv, st, ts, pst: ts ? (st/ts*100).toFixed(2).replace(".",",") : "0,00", cands};
}
function miniCands(r, n) {
  if (!r.vv) return `<div class="meta" style="margin-top:6px"><i>sem votos apurados</i></div>`;
  const maxp = num(r.cands[0]?.pvap)||1;
  return `<div class="cands" style="margin-top:6px">` + r.cands.slice(0,n).map((c,i)=>
    `<div class="cand"><div class="cl"><span class="nm">${nmCase(c.nome)}</span><span class="ptag ${ccls(c)}">${esc(c.partido)}</span></div>
     <div class="cv"><span class="pc">${esc(c.pvap)}%</span><div class="bar"><i class="${ccls(c)}" style="width:${Math.min(100,num(c.pvap)/maxp*100).toFixed(1)}%"></i></div><span class="vt">${fint(c.vap)}</span></div></div>`).join("") + `</div>`;
}
const progMini = pst => `<div class="prog"><div style="width:${Math.min(100,num(pst))}%"></div></div>`;
function renderPresUF(results) { // results: {uf: parseU()|Error}
  const errs = Object.entries(results).filter(([u,r])=>u!=="zz" && r instanceof Error);
  let reg = `<section id="s-reg"><h2 class="grp">Presidente · por região</h2><div class="meta" style="margin-top:8px">Soma dos votos válidos das UFs (sem exterior)</div>%%MAP%%<div class="grid r">`;
  const aggs = [];
  let uf = `<section id="s-uf"><h2 class="grp">Presidente · por estado (27 UFs)</h2><div class="grid u">`;
  for (const [nome, ufs] of REGIOES) {
    const have = ufs.filter(u => results[u] && !(results[u] instanceof Error)).map(u=>results[u]);
    const missing = ufs.filter(u => !have.includes(results[u]));
    const a = aggregate(have); aggs.push([nome, a, have.reduce((s,r)=>s+ufRemaining(r),0)]);
    reg += `<div class="card rc"><h3><span>${nome}</span><span class="meta"><b>${esc(a.pst)}%</b> apurado</span></h3>${progMini(a.pst)}${missing.length?`<div class="errbox">faltam: ${missing.join(", ").toUpperCase()}</div>`:""}${miniCands(a,3)}</div>`;
    uf += `<div class="rgh">${nome}</div>`;
    for (const u of ufs) { const r = results[u];
      uf += r instanceof Error || !r ? `<div class="card uc"><h3><span>${u.toUpperCase()}</span></h3><div class="errbox">${esc(r?r.message:"sem dados")}</div></div>`
          : `<div class="card uc"><h3><span>${u.toUpperCase()}</span><span class="meta"><b>${esc(r.pst)}%</b> apurado${finTag(r)}</span></h3>${progMini(r.pst)}${miniCands(r,2)}</div>`; }
  }
  reg = reg.replace("%%MAP%%", renderMap(aggs, results));
  return reg + `</div></section>` + uf + `</div>${errs.length?`<div class="errbox">${errs.length} UF(s) com erro</div>`:""}</section>`;
}

// ---- Probabilidade (projeção Monte Carlo, Presidente) ----
// 1º turno 2022, % válidos [Lula, Bolsonaro] por UF (TSE, via Wikipedia "2022 Brazilian general election", tabela "Votes by federative unit")
const PRIOR22 = {ac:[29.26,62.5],al:[56.5,36.05],ap:[45.67,43.41],am:[49.58,42.8],ba:[69.73,24.31],ce:[65.91,25.38],es:[40.4,52.23],df:[36.85,51.65],

  const hn=location.hostname, sameOrigin = hn==="187.77.36.67" || hn.endsWith(".trycloudflare.com") || /^eleicoes\.melologistica\.com(\.br)?$/.test(hn);
  const ONL_API = sameOrigin ? "api/online" : "https://enzyme-pork-ozone-organised.trycloudflare.com/api/online"; // GitHub Pages etc. -> contador do VPS via túnel (CORS)
  const el=document.getElementById("online"); let last=0;
  async function ping(){ if (document.hidden) return; last=Date.now();
    try { const r=await fetch(ONL_API+"?id="+encodeURIComponent(id),{cache:"no-store"}); if(!r.ok) throw 0; const j=await r.json();
      const n=+j.online||1; el.querySelector("b").textContent=n.toLocaleString("pt-BR"); el.querySelector(".ol-l").textContent=n===1?" pessoa online agora":" pessoas online agora"; el.hidden=false;
    } catch(e){ el.hidden=true; } }
  ping(); setInterval(ping,20000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && Date.now()-last>5000) ping(); });
})();
</script>
